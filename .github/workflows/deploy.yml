name: Build and Deploy AKS

on:
  push:
    branches:
      - main

jobs:

  deploy:

    runs-on: self-hosted

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Login to ACR
      run: |
        az acr login --name ${{ secrets.ACR_NAME }}

    - name: Build Docker Image
      run: |
        docker build -t aks-demo:${{ github.sha }} .

    - name: Tag Docker Image
      run: |
        docker tag aks-demo:${{ github.sha }} \
        ${{ secrets.ACR_NAME }}.azurecr.io/aks-demo:${{ github.sha }}

    - name: Push Docker Image
      run: |
        docker push \
        ${{ secrets.ACR_NAME }}.azurecr.io/aks-demo:${{ github.sha }}

    - name: Get AKS Credentials
      run: |
        az aks get-credentials \
        --resource-group ${{ secrets.AKS_RESOURCE_GROUP }} \
        --name ${{ secrets.AKS_CLUSTER_NAME }} \
        --overwrite-existing

    - name: Deploy Using Helm
      run: |
        helm upgrade --install aks-demo ./helm/aks-demo \
        --set image.repository=${{ secrets.ACR_NAME }}.azurecr.io/aks-demo \
        --set image.tag=${{ github.sha }}
