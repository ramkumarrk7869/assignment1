apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aks-demo-ingress
spec:
  ingressClassName: nginx

  rules:
  - host: aksdemo.internal
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aks-demo
            port:
              number: 80
